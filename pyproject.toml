[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-save-public"
version = "0.1.0"
description = "Public examples and utilities for gradually open-sourcing SAVE workflows."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [
  { name = "Lijiahao" },
]
dependencies = [
  "anndata==0.11.3",
  "matplotlib==3.10.1",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "POT==0.9.5",
  "pyparsing==3.2.1",
  "scanpy==1.11.0",
  "scikit-learn==1.5.2",
  "scipy==1.15.2",
  "torch==2.5.1",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
generation = [
  "einops==0.8.0",
  "flow-matching==1.0.10",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups = ["dev"]
